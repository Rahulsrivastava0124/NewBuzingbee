# Admin panel (nginx) + API. Secrets live in ../Backend/.env (copy .env.example).
services:
  admin-panel:
    build:
      context: .
      dockerfile: Dockerfile
      # The browser calls the API directly; bake its public URL in at build time
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    container_name: buzingbee-admin-panel
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: buzingbee-backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - ../Backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - backend-uploads:/app/uploads

volumes:
  backend-uploads:
