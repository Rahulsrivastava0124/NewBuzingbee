<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics Integration Example</title>
  </head>
  <body>
    <h1>Your Website Content</h1>
    <p>
      This is an example of how to integrate analytics tracking into your
      frontend website.
    </p>

    <!-- Analytics Tracking Script -->
    <script>
      // Analytics Configuration
      const ANALYTICS_CONFIG = {
        apiUrl: "http://localhost:3001/api/analytics/track",
        websiteName: "buzingbee", // Change this to your website name
      };

      // Detect device type (improved detection)
      function detectDevice() {
        const ua = navigator.userAgent.toLowerCase();
        if (/tablet|ipad|playbook|silk/i.test(ua)) return "tablet";
        if (
          /mobile|android|iphone|ipod|blackberry|iemobile|opera mini/i.test(ua)
        )
          return "mobile";
        return "desktop";
      }

      // Get user location (optional - you can implement IP-based location on backend)
      function getUserLocation() {
        return null; // Optional: implement geolocation or leave null
      }

      // Track page view
      async function trackPageView() {
        try {
          const data = {
            page: window.location.pathname,
            device: detectDevice(),
            location: getUserLocation(),
            website: ANALYTICS_CONFIG.websiteName,
          };

          // IP address is automatically extracted by backend - no need to send it!
          const response = await fetch(ANALYTICS_CONFIG.apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();
          if (result.tracked) {
            console.log("✅ Analytics tracked:", data);
          } else {
            console.log("ℹ️ Visit already counted (same IP within 1 hour)");
          }
        } catch (error) {
          console.error("Analytics tracking failed:", error);
        }
      }

      // Track on page load
      window.addEventListener("load", trackPageView);

      // Optional: Track on route changes (for SPAs)
      let lastPath = window.location.pathname;
      setInterval(() => {
        if (window.location.pathname !== lastPath) {
          lastPath = window.location.pathname;
          trackPageView();
        }
      }, 1000);
    </script>
  </body>
</html>
